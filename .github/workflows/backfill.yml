name: Backfill histórico de medios

on:
  schedule:
    # Domingos 08:00 UTC (02:00 CDMX) — semanal, para no cargar el cron diario
    - cron: '0 8 * * 0'
  workflow_dispatch:
    inputs:
      dias:
        description: 'Días hacia atrás a recuperar'
        required: false
        default: '90'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Backfill histórico (WP-API + sitemap)
        run: python scraper/scraper_medios.py backfill ${{ github.event.inputs.dias || '90' }}

      - name: Commit y push si hay cambios
        run: |
          git config user.name "scope-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/noticias-estatales-historico.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "auto: backfill histórico de medios $(TZ=America/Mexico_City date +'%Y-%m-%d')"
            git push
          fi
