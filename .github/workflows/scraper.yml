name: SCOPE - Scraper Legislativo Diario

on:
  schedule:
    # TODOS los días. 04:30 CDMX (10:30 UTC) — listo antes de las 7 AM con buffer
    # para los retrasos del cron de GitHub Actions + el runtime de los scrapers.
    - cron: "30 10 * * *"
    # 12:00 PM CDMX (18:00 UTC)
    - cron: "0 18 * * *"
    # 4:00 PM CDMX (22:00 UTC)
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias Python
        run: pip install requests beautifulsoup4 lxml feedparser

      # ── Scrapers de contenido ─────────────────────────────────────────────

      - name: Scraper Noticias (Google News RSS)
        run: python scraper/scraper.py

      - name: Scraper COFEPRIS (regulatorio sanitario)
        run: python scraper/scraper_cofepris.py

      - name: Scraper CONAGUA / REPDA (agua)
        run: python scraper/scraper_conagua.py

      - name: Scraper Energia (SENER / CNE / CENACE)
        run: python scraper/scraper_energia.py

      - name: Scraper DOF (Diario Oficial de la Federacion)
        run: python scraper/scraper_dof.py

      - name: Scraper Federal (Gaceta Parlamentaria)
        run: python scraper/scraper_gacetas.py

      - name: Scraper Presidencia (Sheinbaum)
        run: python scraper/scraper_presidencia.py

      - name: Scraper SIL (Iniciativas Legislativas)
        run: python scraper/scraper_sil.py

      - name: Scraper Leyes Estatales
        run: python scraper/scraper_leyes_estatales.py

      # ── Commit y push ─────────────────────────────────────────────────────

      - name: Commit y push del JSON actualizado
        run: |
          git config user.name "SCOPE Bot"
          git config user.email "scope-bot@igemiac.com"
          git add data/noticias.json data/dof.json data/gaceta-federal.json data/gaceta-estatal.json data/presidencia.json data/sil.json data/leyes-estatales.json
          if git diff --staged --quiet; then
            echo "Sin cambios nuevos"
          else
            git commit -m "Auto: SCOPE $(date +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push
          fi
