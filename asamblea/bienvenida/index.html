<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Iniciativa GEMI · Asamblea XXXII</title>
<link rel="icon" href="/assets/logo-gemi-icon.png">
<style>
@font-face{font-family:'Scope Sans';src:url('/assets/fonts/heros-regular.woff2') format('woff2');font-weight:1 550;font-style:normal;font-display:block}
@font-face{font-family:'Scope Sans';src:url('/assets/fonts/heros-bold.woff2') format('woff2');font-weight:551 1000;font-style:normal;font-display:block}
@property --a{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --w{syntax:'<percentage>';inherits:false;initial-value:-20%}
:root{--sans:'Scope Sans','Helvetica Neue',Helvetica,Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#000;color:#fff}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased}
body.idle{cursor:none}
.tex{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 45%,rgba(255,255,255,.075),rgba(255,255,255,0) 70%),repeating-linear-gradient(0deg,rgba(255,255,255,.028) 0 1px,transparent 1px 3px)}
.grain{position:fixed;inset:-50%;z-index:1;pointer-events:none;opacity:.3;background-size:240px 240px;animation:grain 1.1s steps(5) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-2%,1.5%)}40%{transform:translate(1.5%,-2%)}60%{transform:translate(-1%,-.5%)}80%{transform:translate(2%,2%)}100%{transform:translate(0,0)}}
.vig{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 100% 90% at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%)}
canvas#fx{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:4}
.wrap{position:relative;z-index:3;height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:5vh 5vw}
h1{font-weight:800;font-size:clamp(38px,5.4vw,92px);letter-spacing:-.03em;line-height:1.05;height:1.1em;white-space:nowrap}
h1 .box{display:inline-block;text-align:left}
h1 .car{display:inline-block;width:.04em;height:.8em;background:rgba(255,255,255,.85);margin-left:.05em;vertical-align:-.06em;animation:caret 1.05s step-end infinite}
@keyframes caret{50%{opacity:0}}
.stage{position:relative;width:var(--S);height:var(--S);margin:clamp(26px,5vh,52px) 0}
.lg{position:absolute;inset:0}
.stage img{position:absolute;inset:0;width:100%;height:100%;opacity:0;user-select:none;-webkit-user-drag:none}
.L-arco{-webkit-mask-image:conic-gradient(from 0deg at 50% 50%,#000 var(--a),transparent calc(var(--a) + 14deg));mask-image:conic-gradient(from 0deg at 50% 50%,#000 var(--a),transparent calc(var(--a) + 14deg))}
.go .L-arco{animation:sweep 1.6s cubic-bezier(.55,0,.25,1) 2.25s forwards,fin .01s linear 2.25s forwards}
@keyframes sweep{from{--a:0deg}to{--a:376deg}}
.L-ola1,.L-ola2,.L-hoja{-webkit-mask-image:linear-gradient(90deg,#000 var(--w),transparent calc(var(--w) + 18%));mask-image:linear-gradient(90deg,#000 var(--w),transparent calc(var(--w) + 18%))}
.go .L-ola1{animation:wipe 1.1s cubic-bezier(.5,0,.2,1) 2.95s forwards,fin .01s 2.95s forwards}
.go .L-ola2{animation:wipe 1s cubic-bezier(.5,0,.2,1) 3.25s forwards,fin .01s 3.25s forwards}
.go .L-hoja{animation:wipe 1.3s cubic-bezier(.5,0,.2,1) 3.55s forwards,fin .01s 3.55s forwards}
@keyframes wipe{from{--w:-20%}to{--w:102%}}
@keyframes fin{to{opacity:1}}
.L-punto{transform:scale(0);transform-origin:80% 15%}
.go .L-punto{animation:pop .7s cubic-bezier(.3,1.7,.5,1) 4.55s forwards}
@keyframes pop{0%{opacity:1;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
.stage img.gone{animation:none!important;opacity:0!important;-webkit-mask:none;mask:none}
.sheen{position:absolute;inset:0;opacity:0;pointer-events:none;
  -webkit-mask:url('../img/logo-vec.svg') center/100% 100% no-repeat;mask:url('../img/logo-vec.svg') center/100% 100% no-repeat;
  background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.3) 49%,rgba(255,255,255,0) 60%) no-repeat;background-size:260% 100%;background-position:120% 0}
.live .sheen{opacity:1;animation:sheen 4.2s cubic-bezier(.45,0,.2,1) infinite}
@keyframes sheen{0%,30%{background-position:120% 0}100%{background-position:-60% 0}}
.live .lg{animation:breathe 9s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.006)}}
.out .sheen{opacity:0!important;animation:none!important}
.as{font-family:var(--sans);font-size:clamp(15px,1.5vw,22px);font-weight:700;letter-spacing:.42em;text-transform:uppercase;padding-left:.42em;color:rgba(255,255,255,.9);opacity:0;transform:translateY(10px);transition:opacity 1.1s,transform 1.1s cubic-bezier(.2,.7,.2,1)}
.on2 .as{opacity:1;transform:none}
.out .as{opacity:0;transform:translateY(-6px)}
.ft{position:fixed;left:0;right:0;bottom:5vh;z-index:3;text-align:center;font-family:var(--sans);font-size:clamp(13px,1.1vw,16px);letter-spacing:.02em;color:rgba(255,255,255,.45);opacity:0;transition:opacity 1.6s}
.on3 .ft{opacity:1}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  .stage img{opacity:1!important;transform:none!important;-webkit-mask:none!important;mask:none!important}
  .as,.ft{opacity:1!important;transform:none!important}
}
</style>
</head>
<body>
<div class="tex"></div><div class="grain"></div><div class="vig"></div>
<div class="wrap" id="w">
  <h1 aria-label="Bienvenidas y bienvenidos"><span class="box" id="box"><span id="tw"></span><i class="car"></i></span></h1>
  <div class="stage" id="stage">
    <div class="lg">
      <img class="L-arco" src="../img/v-arco.svg" alt="">
      <img class="L-ola1" src="../img/v-ola1.svg" alt="">
      <img class="L-ola2" src="../img/v-ola2.svg" alt="">
      <img class="L-hoja" src="../img/v-hoja.svg" alt="">
      <img class="L-punto" src="../img/v-punto.svg" alt="Iniciativa GEMI">
      <div class="sheen"></div>
    </div>
  </div>
  <div class="as">Asamblea XXXII</div>
</div>
<div class="ft">18 de noviembre de 2026</div>
<canvas id="fx"></canvas>
<script>
(function(){
'use strict';
(function(){var c=document.createElement('canvas');c.width=c.height=240;var x=c.getContext('2d'),im=x.createImageData(240,240),d=im.data;
  for(var i=0;i<d.length;i+=4){var v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=Math.random()<.5?70:30;}
  x.putImageData(im,0,0);var g=document.querySelector('.grain');if(g)g.style.backgroundImage='url('+c.toDataURL()+')';})();
var W=document.getElementById('w'),stage=document.getElementById('stage'),tw=document.getElementById('tw'),box=document.getElementById('box');
var fx=document.getElementById('fx'),fxx=fx.getContext('2d');
var RM=window.matchMedia('(prefers-reduced-motion: reduce)').matches,DPR=Math.min(window.devicePixelRatio||1,2);
var WORD='Bienvenidas y bienvenidos',CYCLE=45;
var imgs={};[].forEach.call(stage.querySelectorAll('img'),function(im){imgs[im.className.replace('L-','')]=im;});
function sizeStage(){var S=Math.round(Math.min(window.innerWidth*.28,window.innerHeight*.4));document.documentElement.style.setProperty('--S',S+'px');}
function reserve(){var keep=tw.textContent;box.style.minWidth='';tw.textContent=WORD;var w=box.offsetWidth;box.style.minWidth=w+'px';tw.textContent=keep;}
var tq=[];function clearT(){tq.forEach(clearTimeout);tq=[];}
function at(ms,fn){tq.push(setTimeout(fn,ms));}
function type(startMs){var acc=startMs;for(var i=1;i<=WORD.length;i++){acc+=WORD[i-1]===' '?60:(70+Math.random()*40);(function(n,ms){at(ms,function(){tw.textContent=WORD.slice(0,n);});})(i,acc);}}
function erase(startMs){for(var i=WORD.length-1;i>=0;i--)(function(n){at(startMs+(WORD.length-n)*38,function(){tw.textContent=WORD.slice(0,n);});})(i);}
var PIECES=[{n:'arco',k:1700,t0:.55,land:2.25,fade:3.7},{n:'ola1',k:460,t0:1.25,land:2.95,fade:4.1},{n:'ola2',k:210,t0:1.5,land:3.25,fade:4.3},
            {n:'hoja',k:1350,t0:1.8,land:3.55,fade:4.9},{n:'punto',k:45,t0:2.9,land:4.55,fade:5.1}];
var TEND=5.2,SAMP=300,pts=[],t0=0,phase='build',outAt=0,W0=0,H0=0;
function load(src){return new Promise(function(r){var im=new Image();im.onload=function(){r(im)};im.onerror=function(){r(null)};im.src=src;});}
function rnd(a,b){return a+Math.random()*(b-a)}
function resize(){W0=window.innerWidth;H0=window.innerHeight;sizeStage();reserve();fx.width=W0*DPR;fx.height=H0*DPR;fxx.setTransform(DPR,0,0,DPR,0,0);retarget();}
function retarget(){var r=stage.getBoundingClientRect();pts.forEach(function(q){q.tx=r.left+q.u*r.width;q.ty=r.top+q.v*r.height;q.ts=r.width/SAMP*.62;});}
function build(){
  pts=[];var sr=stage.getBoundingClientRect();
  PIECES.forEach(function(p,j){var cells=(p.cells||[]).slice();
    for(var i=0;i<p.k&&cells.length;i++){var c=cells.splice(Math.floor(Math.random()*cells.length),1)[0];
      var a=Math.random()*6.283,rr=sr.width*rnd(.7,1.15);
      pts.push({p:j,u:c[0],v:c[1],col:'rgb('+c[2]+','+c[3]+','+c[4]+')',sx:sr.left+sr.width/2+Math.cos(a)*rr,sy:sr.top+sr.height/2+Math.sin(a)*rr,
        d:p.t0+Math.random()*.6,dur:rnd(1.2,1.6),bend:rnd(-.12,.12),land:p.land,fade:p.fade});}
  });
  retarget();
}
function ease(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2}
function cycle(){
  clearT();W.classList.remove('go','on2','live','out');document.body.classList.remove('on3');
  for(var k in imgs)imgs[k].classList.remove('gone');void W.offsetWidth;
  tw.textContent='';build();t0=performance.now();phase='build';
  if(RM){W.classList.add('go','on2','live');document.body.classList.add('on3');tw.textContent=WORD;return;}
  W.classList.add('go');
  type(4300);
  at(6900,function(){W.classList.add('on2');});
  at(7300,function(){W.classList.add('live');document.body.classList.add('on3');});
  at((CYCLE-TEND-2.6)*1000,function(){erase(0);W.classList.add('out');document.body.classList.remove('on3');});
  at((CYCLE-TEND-1)*1000,dissolve);
  at(CYCLE*1000,cycle);
}
function dissolve(){
  phase='out';outAt=performance.now();
  PIECES.forEach(function(p){var im=imgs[p.n];if(!im)return;at(Math.max(0,(TEND-p.land))*1000,function(){im.classList.add('gone');});});
}
function frame(now){
  fxx.clearRect(0,0,W0,H0);
  if(!RM){
    var t=phase==='out'?TEND-(now-outAt)/1000:(now-t0)/1000;
    for(var j=0;j<pts.length;j++){var q=pts[j];
      var k2=Math.min(1,Math.max(0,(t-q.d)/q.dur));if(k2<=0)continue;var e2=ease(k2);
      var mx=(q.sx+q.tx)/2-(q.ty-q.sy)*q.bend,my=(q.sy+q.ty)/2+(q.tx-q.sx)*q.bend;
      var x=(1-e2)*(1-e2)*q.sx+2*(1-e2)*e2*mx+e2*e2*q.tx,y=(1-e2)*(1-e2)*q.sy+2*(1-e2)*e2*my+e2*e2*q.ty;
      var sz=.6+(q.ts-.6)*e2,al=(t<q.land?Math.min(1,k2*2):Math.max(0,1-(t-q.land)/(q.fade-q.land)));if(al<=0)continue;
      fxx.globalAlpha=al;fxx.fillStyle=q.col;fxx.beginPath();fxx.arc(x,y,Math.max(.5,sz),0,6.283);fxx.fill();}
    fxx.globalAlpha=1;}
  requestAnimationFrame(frame);
}
Promise.all(PIECES.map(function(p){return load('../img/v-'+p.n+'.svg')})).then(function(ims){
  ims.forEach(function(im,j){var p=PIECES[j];p.cells=[];if(!im)return;
    var c=document.createElement('canvas');c.width=c.height=SAMP;var x=c.getContext('2d');x.drawImage(im,0,0,SAMP,SAMP);
    var d;try{d=x.getImageData(0,0,SAMP,SAMP).data}catch(e){return}
    for(var y=0;y<SAMP;y++)for(var xx=0;xx<SAMP;xx++){var o=(y*SAMP+xx)*4;if(d[o+3]>160)p.cells.push([xx/SAMP,y/SAMP,d[o],d[o+1],d[o+2]]);}});
  (document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(function(){resize();cycle();requestAnimationFrame(frame);});
});
window.addEventListener('resize',resize);
window.addEventListener('keydown',function(e){
  if(e.key==='f'||e.key==='F'){if(!document.fullscreenElement)document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();else document.exitFullscreen();}
  if(e.key==='r'||e.key==='R'){cycle();}
});
var it;function wake(){document.body.classList.remove('idle');clearTimeout(it);it=setTimeout(function(){document.body.classList.add('idle')},2200);}
window.addEventListener('mousemove',wake);wake();
})();
</script>
</body>
</html>
