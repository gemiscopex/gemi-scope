<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tu opinión sobre Scope</title>

<meta name="robots" content="noindex">

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
@font-face{font-family:'Scope Sans';src:url('/assets/fonts/heros-regular.woff2') format('woff2');font-weight:100 550;font-display:swap}
@font-face{font-family:'Scope Sans';src:url('/assets/fonts/heros-bold.woff2') format('woff2');font-weight:551 1000;font-display:swap}
:root{
  --bg:#FFFFFF;--soft:#F6F8FA;--ink:#0D1B2A;--ink2:#3D5A75;--sec:#5A7A98;--mute:#8A9CB0;

  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --sans:'Scope Sans','Helvetica Neue',Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100vh;display:flex;flex-direction:column}
.grid{position:fixed;inset:0;pointer-events:none;z-index:0;background-image:linear-gradient(#EDF2F6 1px,transparent 1px),linear-gradient(90deg,#EDF2F6 1px,transparent 1px);background-size:52px 52px;-webkit-mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%);mask-image:radial-gradient(ellipse at 50% 40%,#000 25%,transparent 75%)}
header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:20px 28px}
header img{height:26px;display:block}
.cnt{font-family:var(--mono);font-size:12px;color:var(--mute);font-variant-numeric:tabular-nums}
.bar{position:fixed;top:0;left:0;right:0;height:3px;background:var(--line);z-index:3}
.bar i{display:block;height:100%;width:0;background:var(--teal);transition:width .45s cubic-bezier(.3,0,.2,1)}
main{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;padding:24px 20px 120px}
.q{margin:auto 0}
.q{width:100%;max-width:640px;animation:in .45s cubic-bezier(.2,.7,.2,1)}
.q.out{animation:out .25s ease forwards}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-14px)}}
.k{font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--teal);font-weight:600;display:flex;gap:10px;align-items:center}
.k::after{content:"";flex:1;height:1px;background:var(--line)}
h1{font-size:clamp(26px,4.2vw,40px);line-height:1.1;letter-spacing:-.02em;font-weight:700;margin:16px 0 0;text-wrap:balance}
.h{font-size:16px;line-height:1.55;color:var(--ink2);margin:12px 0 0;max-width:56ch}
.ops{display:flex;flex-direction:column;margin-top:26px;border-top:1px solid var(--line)}
.op{display:grid;grid-template-columns:30px 1fr 20px;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 10px;font:inherit;font-size:16px;color:var(--ink);cursor:pointer;transition:background .15s}
.op:hover{background:var(--soft)}
.op:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.op .l{font-family:var(--mono);font-size:12px;color:var(--mute);font-weight:500}
.op .c{width:18px;height:18px;border:1.5px solid var(--line2);border-radius:50%;position:relative}
.multi .op .c{border-radius:3px}
.op.on{background:var(--teal-l)}
.op.on .l{color:var(--teal);font-weight:600}
.op.on .c{border-color:var(--teal);background:var(--teal)}
.op.on .c::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.op small{display:block;font-size:13px;color:var(--sec);margin-top:2px}
.fld{display:block;margin-top:22px}
.fld span{display:block;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
input[type=text],input[type=email],textarea{width:100%;border:0;border-bottom:1.5px solid var(--line2);background:transparent;font:inherit;font-size:20px;color:var(--ink);padding:10px 0;outline:none;transition:border-color .15s}
textarea{font-size:17px;line-height:1.5;resize:vertical;min-height:110px}
input:focus,textarea:focus{border-color:var(--teal)}
.otro{margin:6px 0 0 52px;display:none}
.otro.on{display:block}
.otro input{font-size:16px}
.sc{display:grid;gap:6px;margin-top:28px}
.sc .row{display:grid;gap:6px}
.sc button{height:52px;border:1px solid var(--line2);background:#fff;border-radius:4px;font-family:var(--mono);font-size:16px;color:var(--ink);cursor:pointer;transition:all .15s}
.sc button:hover{border-color:var(--teal)}
.sc button.on{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:600}
.sc .ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--mute);margin-top:4px}
.nav{display:flex;align-items:center;gap:16px;margin-top:30px}
.go{border:0;background:var(--ink);color:#fff;font:inherit;font-weight:700;font-size:15px;padding:13px 22px;border-radius:4px;cursor:pointer;transition:opacity .15s}
.go:disabled{opacity:.35;cursor:default}
.go:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.hint{font-family:var(--mono);font-size:11px;color:var(--mute)}
.back{position:fixed;left:24px;bottom:24px;z-index:3;border:1px solid var(--line2);background:#fff;font-family:var(--mono);font-size:12px;color:var(--sec);padding:8px 12px;border-radius:4px;cursor:pointer}
.back[hidden]{display:none}
.err{color:var(--err);font-size:14px;margin-top:12px;min-height:1em}
.consent{display:flex;gap:10px;align-items:flex-start;margin-top:22px;font-size:13px;color:var(--sec);line-height:1.5}
.consent input{margin-top:3px;accent-color:var(--teal)}
.consent a{color:var(--ink2)}
.done{text-align:left}
.done .tick{width:44px;height:44px;border-radius:50%;background:var(--teal);display:grid;place-items:center;margin-bottom:22px}
.done .tick::after{content:"";width:10px;height:20px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-2px,-2px)}
@media (max-width:560px){header{padding:16px}.op{font-size:15px}.sc .row.n11{grid-template-columns:repeat(6,1fr)!important}h1{font-size:26px}}
@media (prefers-reduced-motion:reduce){.q,.q.out{animation:none}.bar i{transition:none}}
</style>
</head>

  if(!$('f-ok').checked)return err('Marca la casilla del aviso de privacidad para enviar.');
  var g=$('go');g.disabled=true;g.textContent='Enviando…';
  var r={};visible().forEach(function(x){if(['intro','datos','fin'].indexOf(x.t)<0){r[x.id]=A[x.id]===undefined?null:A[x.id];if(A[x.id+'_otro'])r[x.id+'_otro']=A[x.id+'_otro'];}});
  var d=A.datos||{},body={nombre:d.nombre,correo:d.correo,institucion:d.empresa||null,cargo:d.cargo||null,interes:'Cuestionario de experiencia con Scope',origen:'cuestionario-scope',
    mensaje:JSON.stringify({respuestas:r,ref:document.referrer||'',utm:location.search||'',ua:navigator.userAgent,enviado:new Date().toISOString()})};
  fetch(URL_,{method:'POST',headers:{'apikey':KEY,'Authorization':'Bearer '+KEY,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(body)})
    .then(function(res){if(!res.ok)throw 0;hist=[];i=Q.length;Q.push({t:'done'});render();$('bar').style.width='100%';$('cnt').textContent='';})
    .catch(function(){g.disabled=false;g.textContent='Enviar respuestas';err('No se pudo enviar. Revisa tu conexión e intenta de nuevo, o escríbenos a contacto@scopegemi.com.');});
}
$('back').onclick=function(){if(hist.length){i=hist.pop();render();}};
document.addEventListener('keydown',function(e){var x=Q[i];if(!x)return;var t=e.target.tagName;
  if(e.key==='Enter'){if(x.t==='long'){if(e.ctrlKey||e.metaKey){e.preventDefault();$('go').click();}return;}
    if(t==='BUTTON'&&e.target.id!=='go')return;var g=$('go');if(g&&x.t!=='fin'){e.preventDefault();g.click();}return;}
  if((x.t==='one'||x.t==='multi')&&t!=='INPUT'&&/^[a-z]$/i.test(e.key)){var b=document.querySelectorAll('.op')[e.key.toUpperCase().charCodeAt(0)-65];if(b)b.click();}
  if(x.t==='scale'&&t!=='INPUT'&&/^[0-9]$/.test(e.key)){var s=[].filter.call(document.querySelectorAll('.sc button'),function(z){return z.getAttribute('data-v')===e.key;})[0];if(s)s.click();}
});
render();
</script>
